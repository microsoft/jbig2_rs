name: CI

on:
  pull_request:
  push:
    branches: [main, release/0.1, release/0.2]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install audit dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
          components: clippy,rustfmt
      - name: Test validation gates
        run: python -B -m unittest discover -s tools/tests -v
      - name: Check immutable workflow action policy
        run: >-
          python -B tools/check_workflows.py
          --output target/traceability/workflow-policy.json
      - run: python tools/verify_provenance.py
      - run: python tools/audit_runtime.py
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Check executable negative and metamorphic catalogs
        run: >-
          python -B tools/check_test_catalogs.py --discover-tests
          --output target/traceability/test-catalogs.json
      - name: Check provisional normative links and real test discovery
        run: >-
          python -B tools/check_traceability.py --discover-tests
          --output target/traceability/reference-report.json
      - run: cargo doc --no-deps
      - name: Audit package contents
        shell: bash
        run: cargo package --allow-dirty --list | python tools/audit_package.py
      - run: cargo package --allow-dirty
      - name: Install pinned native mutation compiler
        if: runner.os == 'Linux'
        run: rustup toolchain install nightly-2026-10-12 --profile minimal
      - name: Reconcile actual production compiler inventory
        if: runner.os == 'Linux'
        run: >-
          python -B tools/collect_compiler_inventory.py
          --output-dir target/traceability/compiler-inventory
      - name: Check critical public-API mutation sensitivity
        if: runner.os == 'Linux'
        run: >-
          python -B tools/check_contract_mutations.py
          --toolchain nightly-2026-10-12
          --output target/traceability/mutations.json
      - name: Freeze approved internal declaration profile
        if: runner.os == 'Linux'
        run: >-
          python -B tools/check_internal_profile.py
          --compiler-inventory target/traceability/compiler-inventory
          --output target/traceability/internal-profile.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: traceability-${{ matrix.os }}
          path: target/traceability/

  distribution:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: ["1.88.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test isolated proof-free distribution
        run: >-
          python -B tools/check_distribution.py
          --toolchain ${{ matrix.toolchain }}
          --publish-dry-run
          --output target/distribution/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/distribution/report.json
