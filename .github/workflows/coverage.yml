name: Runtime coverage

on:
  pull_request:
  push:
    branches: [main, release/0.1, release/0.2]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r tools/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-12
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Collect runtime coverage and enforce non-regression baseline
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          args=()
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_REF"
            fi
            args+=(--base-ref "$BASE_REF")
          fi
          python -B tools/run_coverage.py "${args[@]}"
      - name: Summarize runtime scope and remaining release goals
        if: always()
        shell: bash
        run: |
          if [[ -f target/coverage/runtime.md ]]; then
            cat target/coverage/runtime.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-coverage
          path: |
            target/coverage/raw.json
            target/coverage/raw.lcov
            target/coverage/runtime.json
            target/coverage/runtime.md
            target/coverage/collection.json
            target/coverage/failure.json
            target/coverage/html/
