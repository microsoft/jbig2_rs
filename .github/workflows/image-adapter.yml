name: Image adapter

on:
  pull_request:
  push:
    branches: [main, release/0.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Image adapter MSRV (${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.88.0
      - run: cargo test --manifest-path adapters/image/Cargo.toml --all-targets --locked
      - run: cargo test --manifest-path adapters/image/Cargo.toml --doc --locked
      - run: cargo check --manifest-path adapters/image/Cargo.toml --release --all-targets --locked

  quality:
    name: Image adapter quality and package
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path adapters/image/Cargo.toml -- --check
      - run: cargo clippy --manifest-path adapters/image/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo doc --manifest-path adapters/image/Cargo.toml --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --manifest-path adapters/image/Cargo.toml --locked
      - name: Test packaged companion against the registry decoder
        run: |
          cargo test --manifest-path adapters/image/target/package/jbig2-image-0.1.0/Cargo.toml --all-targets --locked
          cargo test --manifest-path adapters/image/target/package/jbig2-image-0.1.0/Cargo.toml --doc --locked
          git diff --exit-code
