name: Generated performance comparison

on:
  pull_request:
  push:
    branches: [main, release/0.1, release/0.2]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install audit dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
      - name: Test single-case RSS driver and Linux peak parser
        run: cargo test --locked --example performance_ci
      - name: Test isolated allocator-requested payload controls
        run: cargo test --locked --manifest-path benchmarks/allocation-probe/Cargo.toml
      - name: Validate real slowdown, work-quota, RSS and exact-output controls
        run: python -B tools/check_performance_controls.py --measure-rss --output-dir target/performance-controls
      - name: Compare exact outputs, work quotas and informational timings
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python -B tools/run_performance.py
          --base-ref "$BASE_REF"
          --measure-rss
          --output-dir target/performance-comparison
      - name: Observe paired allocator-requested payloads and exact live controls
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python -B tools/run_allocation.py
          --base-ref "$BASE_REF"
          --measure-phases
          --output-dir target/allocation-comparison
      - name: Summarize deterministic quota gate and informational timings
        if: always()
        shell: bash
        run: |
          if [[ -f target/performance-comparison/report.md ]]; then
            cat target/performance-comparison/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: generated-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/performance-comparison/report.json
            target/performance-comparison/*.json
            target/performance-comparison/*.log
            target/performance-comparison/report.md
            target/performance-controls/control-report.json
            target/performance-controls/*/*.json
            target/performance-controls/*/*.log
            target/performance-controls/*/*.md
            target/allocation-comparison/*.json
            target/allocation-comparison/*.log
            target/allocation-comparison/phases/*.json
